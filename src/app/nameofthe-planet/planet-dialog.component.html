<div class="dialog-container">
  <img
    class="fullscreen-bg"
    src="../../assets/nameplanet2.jpeg"
    alt="Background"
  />

  <!-- Back Arrow -->
  <div class="d-flex justify-content-end pe-4 pt-3">
    <i
      class="bi bi-arrow-left-square-fill home-icon text-white"
      (click)="close()"
    ></i>
  </div>

  <div class="dialog-content container">
    <div class="row align-items-center justify-content-center g-4">
      <!-- LEFT SIDE -->
      <div
        class="col-lg-6 col-md-12 text-white text-center text-lg-start dialog-left"
      >
        <h1>{{ data.title }}</h1>
        <p>{{ data.description }}</p>

        <div class="badge-section mb-3">
          <label>Average temperature:</label>
          <div class="badge">
            <span class="icon">☀️</span> {{ data.temperature }}
          </div>
        </div>

        <div class="badge-section">
          <label>Radius:</label>
          <div class="badge">
            <span class="icon">🌟</span> {{ data.radius }}
          </div>
        </div>
      </div>

      <!-- RIGHT SIDE -->
      <div class="col-lg-4 col-md-8 text-center dialog-right">
        <img
          [src]="data.image"
          alt="{{ data.title }}"
          class="planet-img img-fluid"
        />
      </div>
    </div>
  </div>
</div>
